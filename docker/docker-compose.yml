version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: music_ai_db
    environment:
      POSTGRES_USER: ${DB_USER:-music_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-music_password}
      POSTGRES_DB: ${DB_NAME:-music_ai_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SQL/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./SQL/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-music_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - music_ai_network

  redis:
    image: redis:7-alpine
    container_name: music_ai_redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 3600 1
      --save 300 100
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - music_ai_network

  # Backend API — imagem leve (sem ML), build rapido
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: music_ai_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-music_user}:${DB_PASSWORD:-music_password}@postgres:5432/${DB_NAME:-music_ai_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GENERATIONS_AUDIO_DIR: /app/worker/generations/audio
      GENERATIONS_PARTITURA_DIR: /app/worker/generations/partitura
      GENERATIONS_TABLATURA_DIR: /app/worker/generations/tablatura
    volumes:
      - ../backend:/app
      - ../generations:/app/generations
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - music_ai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker (geracao) — imagem pesada (ML/audio), so rebuildar quando deps ML mudarem
  # Processa apenas a fila 'celery' (geracao Suno + pos-processamento).
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-music_user}:${DB_PASSWORD:-music_password}@postgres:5432/${DB_NAME:-music_ai_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GENERATIONS_AUDIO_DIR: /app/worker/generations/audio
      GENERATIONS_PARTITURA_DIR: /app/worker/generations/partitura
      GENERATIONS_TABLATURA_DIR: /app/worker/generations/tablatura
      # Impede o TensorFlow de tentar detetar GPUs/CUDA (sem GPU no container).
      # Sem isto, o TF bloqueia indefinidamente na primeira chamada ao basic_pitch.
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
    volumes:
      - ../backend:/app
      - ../generations:/app/generations
    command: celery -A worker.celery_app:celery_app worker --pool=solo --queues=celery --loglevel=info
    restart: unless-stopped
    networks:
      - music_ai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Em producao aumentar replicas conforme a carga; 1 chega para dev local
    # deploy:
    #   replicas: 4

  # Celery Worker (notacao) — processa apenas a fila 'notation' (tablatura + partitura).
  # Separado do worker de geracao para que tarefas rapidas (4-9s) nao fiquem
  # bloqueadas atras de tarefas longas de geracao Suno (86-200s).
  celery_worker_notation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-music_user}:${DB_PASSWORD:-music_password}@postgres:5432/${DB_NAME:-music_ai_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GENERATIONS_AUDIO_DIR: /app/worker/generations/audio
      GENERATIONS_PARTITURA_DIR: /app/worker/generations/partitura
      GENERATIONS_TABLATURA_DIR: /app/worker/generations/tablatura
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
    volumes:
      - ../backend:/app
      - ../generations:/app/generations
    command: celery -A worker.celery_app:celery_app worker --pool=solo --queues=notation --loglevel=info
    restart: unless-stopped
    networks:
      - music_ai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (build estatico Vite + Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: music_ai_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped
    networks:
      - music_ai_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # pgAdmin — ferramenta de gestao da BD (apenas dev)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: music_ai_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - music_ai_network

volumes:
  postgres_data:
  redis_data:

networks:
  music_ai_network:
    driver: bridge
